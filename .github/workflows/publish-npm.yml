name: publish-npm

# Publishes @feralfile/display (clients/session-recipient/js) when a GitHub
# release is published. This is the 0.4 line (release/0.4): the ff-relayer
# session path that today's FF OS speaks. Through 0.4.1 the package was
# @feralfile/play. npm refuses to apply `latest` implicitly to a version below
# the highest one published (0.5.0), so this line publishes with an explicit
# `--tag latest`: 0.4.x is what sites install until FF OS 3.0 ships. When 0.5.x
# becomes `latest`, change the tag here to a maintenance tag. Auth is npm OIDC trusted publishing (same pattern as
# @feralfile/cli): configure the trusted publisher for @feralfile/display on
# npmjs.org to point at this repo + this workflow file, environment blank.
#
# First release only: the trusted publisher cannot be configured before the
# package exists (npm/cli#8544), so cut 0.1.0 with an NPM_TOKEN repo secret
# (granular automation token with publish rights on the @feralfile scope).
# Then wire the trusted publisher on the package's npm settings page and
# delete the secret — the publish step below prefers OIDC when no token is
# present.

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # write: the job attaches the browser bundle (dist/display.js, and a
      # play.js copy for sites that self-host under the old name) to the release.
      contents: write
      # OIDC token used by `npm publish --provenance` to authenticate against
      # the trusted publisher configured for @feralfile/display on npmjs.org.
      id-token: write
    defaults:
      run:
        working-directory: clients/session-recipient/js
    steps:
      - uses: actions/checkout@v4

      # Node 24 ships with npm 11.x, which is required for OIDC trusted
      # publishing. Consumers are unaffected; this only affects how CI
      # itself publishes.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify package version matches tag
        run: |
          set -euo pipefail

          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${{ github.event.release.tag_name }}"

          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: package.json is $PACKAGE_VERSION but tag is $TAG_VERSION."
            echo "Before cutting a release, set package.json version to the exact tag (example: tag 0.1.0 -> version 0.1.0)."
            exit 1
          fi

          echo "Version check passed: package.json and tag are both $PACKAGE_VERSION."

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Publish to npm
        # prepack runs the tsc build, so the published tarball ships dist/.
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          VERSION=$(node -p "require('./package.json').version")

          # Idempotent: re-running a release for an already-published version
          # verifies instead of failing.
          if npm view "@feralfile/display@${VERSION}" version > /dev/null 2>&1; then
            echo "@feralfile/display@${VERSION} is already published; skipping."
            exit 0
          fi

          # Bootstrap path, mirroring source-resolver and ff-cli's pre-OIDC
          # release era: npm cannot configure a trusted publisher for a package
          # that does not exist yet (npm/cli#8544), so the first publish
          # authenticates with an NPM_TOKEN repo secret. Once the package
          # exists and its trusted publisher is wired on npmjs.com, delete the
          # secret — publishes then use OIDC with no workflow change.
          if [ -n "${NPM_TOKEN}" ]; then
            echo "NPM_TOKEN secret present: publishing with token auth (bootstrap path)."
            export NODE_AUTH_TOKEN="${NPM_TOKEN}"
          else
            echo "No NPM_TOKEN secret: publishing via OIDC trusted publishing."
          fi

          npm publish --access public --provenance --tag latest

      - name: Attach browser bundle to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          npm run build
          npm run bundle
          cp dist/display.js dist/play.js
          gh release upload "${{ github.event.release.tag_name }}" dist/display.js dist/play.js \
            --clobber --repo "${{ github.repository }}"

      - name: Verify npm package version
        run: |
          set -euo pipefail

          TAG="${{ github.event.release.tag_name }}"
          ATTEMPTS=10
          SLEEP_SECONDS=10

          for attempt in $(seq 1 "$ATTEMPTS"); do
            NPM_VERSION=$(npm view "@feralfile/display@${TAG}" version 2>/dev/null || true)
            if [ "$NPM_VERSION" = "$TAG" ]; then
              echo "npm version check passed: $NPM_VERSION"
              exit 0
            fi

            if [ "$attempt" -lt "$ATTEMPTS" ]; then
              echo "npm version is $NPM_VERSION, expected $TAG; retrying in ${SLEEP_SECONDS}s (${attempt}/${ATTEMPTS})"
              sleep "$SLEEP_SECONDS"
            fi
          done

          echo "npm version check failed: expected $TAG"
          exit 1

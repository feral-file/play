name: publish-npm

# Publishes @feralfile/display (clients/session-recipient/js) when a GitHub
# release is published. The package was @feralfile/play through 0.4.0; this
# workflow no longer publishes that name.
#
# Auth is npm OIDC trusted publishing (same pattern as @feralfile/cli): the
# trusted publisher for @feralfile/display on npmjs.com points at
# feral-file/play, workflow file publish-npm.yml, environment blank, with
# direct `npm publish` allowed (configurations made after 2026-09-03 allow
# only `npm stage publish` unless that box is ticked).
#
# Bootstrap: npm configures a trusted publisher only for a package that
# exists, and expires a configuration that has not published within 2 days.
# So the first version of @feralfile/display is published by an npm owner by
# hand (`npm publish --access public` in clients/session-recipient/js at the
# release commit); the GitHub release for that version then finds it on npm,
# skips the publish and attaches the bundles. The trusted publisher is
# configured right before the next release is cut. An NPM_TOKEN repo secret,
# if present, is used instead of OIDC (the path @feralfile/play 0.1.0 took);
# delete it once the trusted publisher works.

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # write: the job attaches the browser bundle (dist/display.js) to the release.
      contents: write
      # OIDC token used by `npm publish --provenance` to authenticate against
      # the trusted publisher configured for @feralfile/display on npmjs.com.
      id-token: write
    env:
      PACKAGE_NAME: "@feralfile/display"
    defaults:
      run:
        working-directory: clients/session-recipient/js
    steps:
      - uses: actions/checkout@v4

      # Node 24 ships with npm 11.x, which is required for OIDC trusted
      # publishing. Consumers are unaffected; this only affects how CI
      # itself publishes.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify package name and version match the tag
        run: |
          set -euo pipefail

          PACKAGE_JSON_NAME=$(node -p "require('./package.json').name")
          if [ "$PACKAGE_JSON_NAME" != "$PACKAGE_NAME" ]; then
            echo "Name mismatch: package.json is $PACKAGE_JSON_NAME but this workflow publishes $PACKAGE_NAME."
            exit 1
          fi

          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${{ github.event.release.tag_name }}"

          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: package.json is $PACKAGE_VERSION but tag is $TAG_VERSION."
            echo "Before cutting a release, set package.json version to the exact tag (example: tag 0.1.0 -> version 0.1.0)."
            exit 1
          fi

          echo "Version check passed: package.json and tag are both $PACKAGE_VERSION."

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Publish to npm
        # prepack runs the tsc build, so the published tarball ships dist/.
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          VERSION=$(node -p "require('./package.json').version")

          # Idempotent: re-running a release for an already-published version
          # verifies instead of failing. This is also the bootstrap path: the
          # first version, published by hand, is skipped here.
          if npm view "${PACKAGE_NAME}@${VERSION}" version > /dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${VERSION} is already published; skipping."
            exit 0
          fi

          # Token path, for a bootstrap through CI instead of by hand (see the
          # header). Without the secret, publishes use OIDC.
          if [ -n "${NPM_TOKEN}" ]; then
            echo "NPM_TOKEN secret present: publishing with token auth (bootstrap path)."
            export NODE_AUTH_TOKEN="${NPM_TOKEN}"
          else
            echo "No NPM_TOKEN secret: publishing via OIDC trusted publishing."
          fi

          if ! npm publish --access public --provenance; then
            echo "::error::npm publish failed. If ${PACKAGE_NAME} has no trusted publisher yet, or it expired (2 days without a publish), configure it on npmjs.com (feral-file/play, publish-npm.yml, environment blank, npm publish allowed) and re-run this job."
            exit 1
          fi

      - name: Attach browser bundle to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          npm run build
          npm run bundle
          gh release upload "${{ github.event.release.tag_name }}" dist/display.js \
            --clobber --repo "${{ github.repository }}"

      - name: Verify npm package version
        run: |
          set -euo pipefail

          TAG="${{ github.event.release.tag_name }}"
          ATTEMPTS=60
          SLEEP_SECONDS=10

          for attempt in $(seq 1 "$ATTEMPTS"); do
            NPM_VERSION=$(npm view "${PACKAGE_NAME}" version)
            if [ "$NPM_VERSION" = "$TAG" ]; then
              echo "npm version check passed: $NPM_VERSION"
              exit 0
            fi

            if [ "$attempt" -lt "$ATTEMPTS" ]; then
              echo "npm version is $NPM_VERSION, expected $TAG; retrying in ${SLEEP_SECONDS}s (${attempt}/${ATTEMPTS})"
              sleep "$SLEEP_SECONDS"
            fi
          done

          echo "npm version check failed: expected $TAG after waiting $((ATTEMPTS * SLEEP_SECONDS))s (${ATTEMPTS} attempts, ${SLEEP_SECONDS}s apart)"
          exit 1

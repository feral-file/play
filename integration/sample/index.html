<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Play on Art Computer</title>
  <style>
    body { max-width: 760px; margin: 48px auto; padding: 24px; font: 16px system-ui; background: #181818; color: #eee; }
    label { display: block; margin: 24px 0; } input, textarea { box-sizing: border-box; display: block; width: 100%; padding: 12px; margin-top: 8px; color: inherit; background: #292929; border: 1px solid #666; border-radius: 6px; }
    button { padding: 12px 20px; border: 0; border-radius: 6px; background: #b8e7ff; color: #111; cursor: pointer; } button:disabled { opacity: .5; }
  </style>
</head>
<body>
  <h1>Play on Art Computer</h1>
  <label>Device ID<input id="device-id" placeholder="FF1-XXXXXXXX" autocomplete="off"></label>
  <label>Relayer endpoint<input id="relayer-url" type="url"></label>
  <label>DP-1 playlist<textarea id="playlist" rows="14" spellcheck="false">{"dpVersion":"1.1.0","title":"Browser playlist","items":[]}</textarea></label>
  <div id="play"></div>
  <script type="module">
    import { mountPlayOnArtComputerButton } from "@feralfile/play";
    const endpoint = document.getElementById("relayer-url");
    endpoint.value = import.meta.env.VITE_RELAYER_URL || "http://127.0.0.1:8787";
    mountPlayOnArtComputerButton({
      container: "#play",
      deviceId: () => document.getElementById("device-id").value.trim(),
      relayerBaseUrl: () => endpoint.value.trim(),
      playlist: () => JSON.parse(document.getElementById("playlist").value)
    });
  </script>
</body>
</html>
